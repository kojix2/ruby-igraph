name: test
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    name: ${{ matrix.os }} Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu", "macos", "windows"]
        ruby: ["3.4"]
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags
          fetch-tags: true
          submodules: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install igraph (macOS)
        if: ${{ matrix.os == 'macos' }}
        run: |
          brew install igraph
      - name: Install igraph (Ubuntu)
        if: ${{ matrix.os == 'ubuntu' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libxml2-dev libgmp-dev libblas-dev liblapack-dev libglpk-dev
          cd igraph
          mkdir -p build && cd build
          cmake .. -DBUILD_SHARED_LIBS=ON -DIGRAPH_ENABLE_LTO=ON -DIGRAPH_OPENMP_SUPPORT=ON -DIGRAPH_GRAPHML_SUPPORT=ON -DIGRAPH_GLPK_SUPPORT=ON -DIGRAPH_ENABLE_TLS=ON -DUSE_CCACHE=ON -DFORCE_COLORED_OUTPUT=ON
          make -j$(nproc)
          sudo make install
          sudo ldconfig
      - name: Install igraph (Windows)
        if: ${{ matrix.os == 'windows' }}
        run: |
          ridk exec pacman -Syu --noconfirm
          ridk exec pacman -S --noconfirm mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-libxml2 mingw-w64-ucrt-x86_64-gmp mingw-w64-ucrt-x86_64-openblas mingw-w64-ucrt-x86_64-glpk mingw-w64-ucrt-x86_64-ninja flex
          cd igraph
          $cmake = Join-Path $env:RI_DEVKIT "ucrt64\bin\cmake.exe"
          $flex = Join-Path $env:RI_DEVKIT "usr\bin\flex.exe"
          $ninja = Join-Path $env:RI_DEVKIT "ucrt64\bin\ninja.exe"
          $cc = Join-Path $env:RI_DEVKIT "ucrt64\bin\gcc.exe"
          $cxx = Join-Path $env:RI_DEVKIT "ucrt64\bin\g++.exe"
          & $cmake -S . -B build -G Ninja "-DCMAKE_MAKE_PROGRAM=$ninja" "-DCMAKE_C_COMPILER=$cc" "-DCMAKE_CXX_COMPILER=$cxx" "-DFLEX_EXECUTABLE=$flex" -DBUILD_SHARED_LIBS=ON -DIGRAPH_ENABLE_LTO=OFF -DIGRAPH_OPENMP_SUPPORT=ON -DIGRAPH_GRAPHML_SUPPORT=ON -DIGRAPH_GLPK_SUPPORT=ON -DIGRAPH_ENABLE_TLS=ON
          & $cmake --build build
      - name: Build and test with Rake
        run: |
          bundle exec rake
        env:
          IGRAPHDIR: ${{ github.workspace }}\igraph\build\src
